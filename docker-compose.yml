name: tutoragent

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres:18 puts PGDATA one level down, so mount the parent.
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  moodle:
    build: ./moodle
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
      MOODLE_DEBUG: ${MOODLE_DEBUG}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    ports:
      - "${MOODLE_PORT}:80"
    volumes:
      # Must stay outside the served directory.
      - moodledata:/var/moodledata
      - ./plugin/local/tutoragent:/var/www/moodle/public/local/tutoragent
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/login/index.php > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  recommender:
    build: ./recommender
    restart: unless-stopped
    environment:
      RECOMMENDER_THRESHOLD: ${RECOMMENDER_THRESHOLD}
    ports:
      - "${RECOMMENDER_PORT}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
  moodledata:
