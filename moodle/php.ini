; max_input_vars is a hard Moodle requirement and a classic install blocker.
memory_limit = 256M
max_input_vars = 5000
post_max_size = 64M
upload_max_filesize = 64M

; The default max_accelerated_files of 10000 is below Moodle's file count.
; validate_timestamps stays on so bind-mounted plugin edits take effect
; without restarting the container.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
opcache.validate_timestamps = 1
